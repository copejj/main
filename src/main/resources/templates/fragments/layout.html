<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" th:fragment="mainLayout(title, content)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="${title}" />
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <header>
        <nav>
            <a class="nav-brand" th:href="@{/}">Braindribbler</a>

            <div class="nav-links">
                <div class="dropdown nav-item">
                    <span>Platforms ▼</span>
                    <div class="dropdown-content">
                        <a th:each="site : ${sites}" th:href="${site.url}" th:text="${site.name + ' Portal'}"
                            target="_blank">Dynamic Site Link</a>
                    </div>
                </div>
            </div>
        </nav>

        <h1>Welcome to the Brain Dribbler</h1>
        <p class="intro">
            A central ecosystem built to experiment with different technologies, exercise problem-solving workflows, and
            host handy tools.
        </p>
    </header>

    <main class="grid-container" th:replace="${content}">
        <!-- Unique page tables/views insert here -->
    </main>

    <footer th:fragment="footer" class="bg-gray-800 text-gray-300 p-6 mt-8 text-center">
        <p>&copy;<span th:text="${#dates.year(#dates.createNow())}">2025</span>
            <span th:text="${siteName}">Brain Dribbling</span>. All rights reserved
        </p>
        <div class="version-label" th:if="${showGitInfo}">
            <small class="text-muted">
                <span th:text="${gitBranch}">main</span>
                (<span th:text="${gitHash}">abcd123</span>)
            </small>
        </div>
    </footer>

</body>

</html>

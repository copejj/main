<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" th:replace="~{fragments/layout :: mainLayout(~{::title}, ~{::main})}">

<head>
    <title>The Brain Dribbler - Home</title>
</head>

<body>
    <main class="grid-container">
        <table>
            <thead>
                <tr>
                    <th></th>
                    <th>Platform</th>
                    <th>Purpose & Features</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="site : ${sites}">
                    <td>
                        <a class="site-link" 
                           th:href="${site.gitHubUrl}" 
                           th:aria-label="'GitHub source code for ' + ${site.name}"
                           target="_blank" 
                           rel="noopener noreferrer">GitHub</a>
                    </td>
                    <td>
                        <a class="site-link" 
                           th:href="${site.url}" 
                           th:text="${site.name}" 
                           target="_blank" 
                           rel="noopener noreferrer">Platform Name</a>
                    </td>
                    <td th:text="${site.description}">Platform Description text.</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
